# Publica el sitio en GitHub Pages compilando en CI.
# Así no hace falta commitear dist/ (que está ignorado) ni romper la raíz del repo.
name: Desplegar en GitHub Pages

# Solo manual: el deploy real es Vercel (vercel.json). Pages queda como
# respaldo activable desde la pestaña Actions (requiere habilitar Pages).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Compilar (base = nombre del repo)
        run: ASTRO_BASE="/${{ github.event.repository.name }}/" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
