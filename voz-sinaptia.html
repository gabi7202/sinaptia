lcance y el tiempo salen de revisar tu proceso juntos, no de una lista. Y una regla: si alguien te promete plazos cerrados sin mirar tu operaci\xF3n, pregunta qu\xE9 est\xE1 dejando fuera." }, { cuando: [/mis datos|privacidad|confidencial|segur/i], decir: "Tus datos no se usan para entrenar modelos de nadie. Se firman acuerdo de confidencialidad y de tratamiento de datos antes de tocar nada, y si tu sector lo exige, el sistema vive en tu propia infraestructura." }, { cuando: [/qu[ée] es (rag|un agente|un agente de ia)|c[óo]mo funciona/i], decir: "Versi\xF3n corta: un agente de IA es un sistema que entiende un mensaje, consulta TUS datos, decide una acci\xF3n y la ejecuta en tus herramientas \u2014 con reglas que definen qu\xE9 puede hacer solo y qu\xE9 necesita tu aprobaci\xF3n. No es un chat flotante: es un empleado digital con l\xEDmites escritos." }, { cuando: [/whatsapp/i], decir: "S\xED, y es de los que m\xE1s retorno da: responder en segundos por WhatsApp, con tu cat\xE1logo real detr\xE1s y derivando a un humano cuando toca negociar. Es la primera pieza t\xEDpica." }, { cuando: [/gracias|perfecto|genial|excelente/i], decir: "A ti. Sigo contigo hasta dejarte el brief listo." }], propuestas: { reglas: [{ cuando: /(responder|consultas|atenci|whatsapp|cliente|lead|venta)/i, titulo: "Agente de respuesta inmediata", que: "Un agente atiende consultas por web y WhatsApp en segundos, consulta tu cat\xE1logo o pol\xEDticas reales, califica al interesado y agenda visitas o llamadas en el calendario del equipo.", fases: "Fase 1: diagn\xF3stico + agente piloto en un canal. Fase 2: integraci\xF3n con tu CRM y todos los canales. Fase 3: panel de m\xE9tricas y mejora continua.", inversion: "3.500 \u2013 12.000 USD seg\xFAn canales e integraciones", no: "No negociar\xE1 precios ni aceptar\xE1 ofertas: esas decisiones siguen siendo humanas." }, { cuando: /(cotiz|factur|documento|transcri|carga|pedido)/i, titulo: "Automatizaci\xF3n de back-office", que: "El sistema lee los docu
